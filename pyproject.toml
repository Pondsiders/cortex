[project]
name = "cortex"
version = "2.1.0"
description = "Alpha's memory: Markdown files in the Vault, with a disposable index over them."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "numpy>=2.1",
    "openai>=1.60",
    "pendulum>=3.0",
    "pydantic-settings>=2.15.0",
    "python-frontmatter>=1.1",
    "tqdm>=4.70.0",
]

[project.scripts]
cortex = "cortex.cli:cortex"

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "pytest>=8.3",
    "ruff>=0.14",
    "types-tqdm>=4.70.0.20260805",
]

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"__main__.py" = ["D100"]
"tests/**" = ["S101", "D100", "D101", "D102", "D103"]

[tool.basedpyright]
typeCheckingMode = "recommended"
reportExplicitAny = false
reportAny = false
# Setting exclude replaces pyright's defaults, which are what keep it out of .venv,
# so include has to be explicit too.
include = ["src", "scripts"]
# A one-off migration script carrying its own PEP 723 dependencies, so its imports
# are not resolvable from the project environment.
exclude = ["scripts/migrate_from_duckdb.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
